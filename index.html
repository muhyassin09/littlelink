<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Griya Area Makassar | BSI</title>
  <meta name="description" content="Pusat dokumen dan referensi Griya Area Makassar.">
  <meta name="theme-color" content="#0b2250">
  <link rel="icon" type="image/webp" href="images/bsi.webp">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{min-height:100%;background:#0b2250;overflow-y:scroll;scrollbar-gutter:stable}
    body{font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#071634 0%,#0b2250 28%,#1f4f9a 68%,#6a97d6 100%)}
    .page{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
    .topbar{position:relative;z-index:2;background:linear-gradient(180deg,#fff 0%,#fff 42%,rgba(255,255,255,.7) 62%,rgba(255,255,255,0) 100%)}
    .topbar-inner{padding:14px clamp(14px,3vw,48px) 64px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .topbar img{display:block;height:clamp(30px,4vw,46px);width:auto;max-width:44%;object-fit:contain}
    /* Lebar dikecilkan (504 -> 460) dan selalu muat di layar HP sampai desktop */
    main{position:relative;z-index:2;width:100%;max-width:460px;margin:0 auto;padding:16px clamp(14px,5vw,20px) 36px}
    header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
    h1{display:block;width:100%;text-align:center;font-size:clamp(1rem,5.4vw,2rem);font-weight:600;letter-spacing:.01em;text-indent:.01em;line-height:1.2;white-space:nowrap}
    .rule{width:56px;height:2px;margin:14px auto;background:linear-gradient(90deg,transparent,#fff,transparent)}
    header p{font-size:.92rem;color:#d3dff4}

    /* Folder: hampir transparan (latar terlihat) dengan outline putih tebal */
    .link,.sub a{
      background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.85);color:#fff;text-shadow:0 1px 3px rgba(2,8,24,.5);
      box-shadow:0 3px 10px rgba(2,8,24,.15);
    }
    .link{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;font:inherit;text-align:left;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
      transition:transform .3s cubic-bezier(.22,.61,.36,1),background-color .2s ease,box-shadow .3s ease}
    .link:hover{transform:translateY(-1px);background:rgba(255,255,255,.12);box-shadow:0 8px 22px rgba(2,8,24,.3)}
    .link:active{transform:none}
    .link:focus-visible,.sub a:focus-visible{outline:3px solid #cfe0ff;outline-offset:3px}
    .ico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:transparent;border:1.5px solid rgba(255,255,255,.8)}
    .ico svg{width:19px;height:19px}
    .link strong{flex:1;min-width:0;font-size:clamp(.78rem,3.6vw,.92rem);font-weight:700;letter-spacing:.03em;overflow-wrap:anywhere}
    .chev{flex:none;width:17px;height:17px;color:#fff;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
    .link[aria-expanded="true"] .chev{transform:rotate(90deg)}

    .panel{display:grid;grid-template-rows:0fr}
    .panel.open{grid-template-rows:1fr}
    .panel-inner{overflow:hidden;min-height:0;margin:0 -26px}
    .panel-pad{padding:0 26px 20px}
    .sub{display:flex;flex-direction:column;gap:8px;padding:10px 0 0 14px;margin-left:18px;border-left:2px solid rgba(255,255,255,.55);visibility:hidden}
    .panel.open .sub{visibility:visible;animation:fade .35s ease backwards}
    .sub a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-weight:600;font-size:clamp(.78rem,3.4vw,.86rem);text-decoration:none;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease}
    .sub a:hover{background:rgba(255,255,255,.12)}
    .sub svg{flex:none;width:17px;height:17px;color:#fff}
    .panel.open .sub a{animation:rise .5s cubic-bezier(.22,.61,.36,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
    .panel.closing .sub{animation:fadeout .2s ease forwards}
    .panel.closing .sub a{animation:none}
    @keyframes rise{from{opacity:0;transform:translateY(-10px)}}
    @keyframes fade{from{opacity:0}}
    @keyframes fadeout{to{opacity:0}}

    .info{margin-top:20px;padding:12px 14px;border-radius:12px;font-size:.82rem;line-height:1.5;color:#eef3fc;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.6);box-shadow:0 3px 10px rgba(2,8,24,.15)}
    .info p{display:flex;gap:10px;align-items:flex-start}
    .info svg{flex:none;width:17px;height:17px;margin-top:2px;color:#cfe0ff}

    /* Latar: garis diam + gerbong tipis (selebar garisnya) + buih + bintang */
    .bg svg{position:absolute;inset:0;width:100%;height:100%}
    .line{fill:none;stroke:#fff;stroke-linecap:round}
    .train{fill:none;stroke:#fff;stroke-linecap:round;animation:run linear infinite}
    @keyframes run{from{stroke-dashoffset:var(--a)}to{stroke-dashoffset:var(--b)}}
    .bub{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.08);opacity:0;will-change:transform,opacity;animation:drift ease-in-out infinite}
    @keyframes drift{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.75}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
    .star{position:absolute;width:var(--s);height:var(--s);opacity:.12;will-change:transform,opacity;animation:twinkle ease-in-out infinite alternate}
    .star svg{display:block;width:100%;height:100%}
    @keyframes twinkle{from{opacity:.1;transform:scale(.85)}to{opacity:.6;transform:scale(1.05)}}
    @media (max-width:640px){.t-extra,.b-extra,.s-extra{display:none}}
    html.lite .t-extra,html.lite .b-extra,html.lite .s-extra{display:none}
    html.calm .train{display:none}
    html.calm .bub{animation:none;opacity:.5}
    html.calm .star{animation:none;opacity:.35}
    @media (prefers-reduced-motion:reduce){.link,.chev{transition:none}.link:hover{transform:none}.panel.open .sub a,.panel.open .sub{animation:none}.train{display:none}.bub{animation:none;opacity:.5}.star{animation:none;opacity:.6}}
  </style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="page">

  <div class="topbar">
    <div class="topbar-inner">
      <img src="images/danantara.webp" alt="Danantara Indonesia">
      <img src="images/bsi.webp" alt="Bank Syariah Indonesia">
    </div>
  </div>

  <main>
    <header>
      <h1>Everything Griya Makassar</h1>
      <div class="rule"></div>
      <p>Pusat dokumen dan referensi Griya</p>
    </header>

    <button class="link folder" id="folderBtn" type="button" aria-expanded="false" aria-controls="subfolders">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
      <strong>EVERYTHING GRIYA MAKASSAR</strong>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <div class="panel" id="subfolders">
      <div class="panel-inner"><div class="panel-pad">
        <nav class="sub" aria-label="Subfolder">
          <a style="--i:0" href="https://bsicenter-my.sharepoint.com/:f:/g/personal/zaenab_nur_bankbsi_co_id/IgAiFcgA8gJzTbJkIgNg7xT2AWoiBYhWQkffQLOw6TAClgs?e=ZTay2u" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Surat Pricing Terbaru</a>
          <a style="--i:1" href="https://bsicenter-my.sharepoint.com/:f:/g/personal/zaenab_nur_bankbsi_co_id/IgC5xORbj-tcSbhPxApmkFTEAd8I-6_tAIrT-dU8J8amQi8?e=GVUMSY" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>Kalkulator Griya</a>
          <a style="--i:2" href="https://bsicenter-my.sharepoint.com/shared?id=%2Fpersonal%2Fangga%5Feka%5Fbankbsi%5Fco%5Fid%2FDocuments%2FHarian%20Konsumer%2F2026%2F10%2D2026&listurl=%2Fpersonal%2Fangga%5Feka%5Fbankbsi%5Fco%5Fid%2FDocuments&ct=1736817967966&or=Teams%2DHL&ga=1" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>Materi Sosialisasi</a>
          <a style="--i:3" href="https://bsicenter-my.sharepoint.com/:f:/g/personal/tri_anggoro_bankbsi_co_id/IgAClTgCHLxRQ6y2m922HFtJAWda5BzcVTt8y5LRVFhxzM0?e=vHUQuQ" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Regulasi &amp; Ketentuan Terbaru</a>
          <a style="--i:4" href="https://bsicenter-my.sharepoint.com/:f:/g/personal/zaenab_nur_bankbsi_co_id/IgANsMMCx9TURa35qig0T2ZJAdwA5KF9RNGyob-JLuEXWcQ?e=uf6vdA" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6M4 21h16"/></svg>Data Developer Area Makassar</a>
        </nav>
      </div></div>
    </div>

    <section class="info" aria-label="Informasi akses">
      <p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Hanya untuk penggunaan internal BSI Griya Area Makassar.</span></p>
    </section>
  </main>

</div>
<script>
  (function(){
    var bg=document.querySelector('.bg'),root=document.documentElement,NS='http://www.w3.org/2000/svg',lw=0,lh=0,rt;
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function el(n,at){var e=document.createElementNS(NS,n);for(var k in at)e.setAttribute(k,at[k]);return e}
    function build(){
      var W=innerWidth,H=innerHeight,k=Math.max(W,H)/1600,UW=W/k,UH=H/k,R=rng(17),lines=[],x,y,i;
      lw=W;lh=H;bg.textContent='';
      function ang(x,y){return .55*Math.sin(x/260+1.3)+.9*Math.cos(y/210+.4)+.7*Math.sin((x+y)/330)+.5*Math.cos((x-1.3*y)/190)}
      function mk(p){
        var d='M'+(p[0][0]*k).toFixed(1)+' '+(p[0][1]*k).toFixed(1),j;
        for(j=1;j<p.length-1;j++)d+='Q'+(p[j][0]*k).toFixed(1)+' '+(p[j][1]*k).toFixed(1)+' '+((p[j][0]+p[j+1][0])/2*k).toFixed(1)+' '+((p[j][1]+p[j+1][1])/2*k).toFixed(1);
        return d;
      }
      for(y=-40;y<UH+40;y+=154*(.8+R()*.3)){
        for(x=-40;x<UW+40;x+=154*(.9+R()*.4)){
          var px=x+R()*60-30,py=y+R()*60-30,pts=[[px,py]],n=9+Math.floor(R()*10);
          for(i=0;i<n;i++){var a=ang(px,py);px+=30*Math.cos(a);py+=30*Math.sin(a);pts.push([px,py])}
          lines.push(pts);
        }
      }
      var vb='0 0 '+W+' '+H,base=el('svg',{viewBox:vb,preserveAspectRatio:'none'}),gusts=el('svg',{viewBox:vb,preserveAspectRatio:'none'}),op=[.18,.26,.34,.42],sw=[.8,1,1.2];
      lines.forEach(function(p){var o=op[Math.floor(R()*4)],w=sw[Math.floor(R()*3)];p.sw=w;base.appendChild(el('path',{'class':'line',d:mk(p),'stroke-opacity':o,'stroke-width':w}))});

      bg.appendChild(base);

      /* Gerbong: satu per jalur, melaju dari ujung dalam ke ujung garis di tepi layar.
         - Tebal gerbong SAMA dengan tebal garisnya (tidak lebih tebal), opacity lembut agar tidak terlihat bold.
         - Panjang dibagi 3 kelompok bergantian (pendek / sedang / panjang), jadi variasinya pasti terlihat. */
      if(!reduce){
        bg.appendChild(gusts);
        var rev=function(p){var r=p.slice().reverse();r.sw=p.sw;return r};
        var ed=function(q){return Math.min(q[0]*k,W-q[0]*k,q[1]*k,H-q[1]*k)};
        var bk=[[],[],[],[]],rest=[],pick=[],more=true,g=0,sd;
        lines.forEach(function(p){
          var f=p[0],z=p[p.length-1],o=ed(f)<ed(z)?rev(p):p,q=o[o.length-1],x=q[0]*k,y=q[1]*k,d=[x,W-x,y,H-y],m=Math.min.apply(null,d);
          if(m<36)bk[d.indexOf(m)].push(o);else rest.push(o);
        });
        while(pick.length<12&&more){more=false;for(sd=0;sd<4;sd++)if(bk[sd].length&&pick.length<12){pick.push(bk[sd].splice(Math.floor(R()*bk[sd].length),1)[0]);more=true}}
        while(pick.length<8&&rest.length)pick.push(rest.splice(Math.floor(R()*rest.length),1)[0]);
        var LEN=[[12,26],[40,75],[110,170]]; /* pendek, sedang, panjang (px) */
        /* Tiap garis dilalui beberapa kereta (2-4), jarak antar kereta dibagi rata di sepanjang siklus
           dengan sedikit variasi, dan tiap kereta punya panjang (pendek/sedang/panjang) sendiri.
           Ubah TRAINS_PER_LINE untuk menambah atau mengurangi jumlahnya. */
        var TRAINS_PER_LINE=[3,2,4,3];
        pick.forEach(function(p,idx){
          var cnt=TRAINS_PER_LINE[idx%TRAINS_PER_LINE.length],L,c;
          for(c=0;c<cnt;c++){
            var e=el('path',{d:mk(p)});gusts.appendChild(e);
            L=e.getTotalLength();
            var cat=LEN[(idx+c)%3],D=Math.round(Math.min(cat[0]+R()*(cat[1]-cat[0]),L*.35)),idle=10+R()*L*.15,sp=(90+R()*50)*.13,dur=(L+D+idle)/sp,ph=(c+R()*.4)/cnt;
            /* di layar kecil: hanya 6 garis pertama, masing-masing 2 kereta */
            e.setAttribute('class','train'+((idx>=6||c>=2)?' t-extra':''));
            e.setAttribute('style','stroke-width:'+p.sw+';stroke-opacity:'+(.5+R()*.2).toFixed(2)+';stroke-dasharray:'+D+' '+Math.ceil(L+D+20)+';--a:'+D+';--b:'+(-Math.ceil(L+idle))+';animation-duration:'+dur.toFixed(1)+'s;animation-delay:-'+(ph*dur).toFixed(1)+'s');
          }
        });
      }

      var foam=document.createElement('div'),nb=Math.min(40,Math.round(W*H/25000)),b,m;
      for(b=0;b<nb;b++){
        var s=2.5+R()*R()*4.5,t=R()*6.2832,r=60+R()*150,du=12+R()*16,q=document.createElement('div');
        q.className='bub'+(b>=14?' b-extra':'');
        q.style.cssText='width:'+s.toFixed(1)+'px;height:'+s.toFixed(1)+'px;left:'+(R()*100).toFixed(1)+'%;top:'+(R()*100).toFixed(1)+'%;--dx:'+(Math.cos(t)*r).toFixed(0)+'px;--dy:'+(Math.sin(t)*r).toFixed(0)+'px;animation-duration:'+du.toFixed(1)+'s;animation-delay:-'+(R()*du).toFixed(1)+'s';
        foam.appendChild(q);
      }
      var ns=Math.min(8,Math.round(W*H/130000)+3);
      for(m=0;m<ns;m++){
        var z=12+R()*12,du2=3+R()*4,st=document.createElement('div');
        st.className='star'+(m>=4?' s-extra':'');
        st.style.cssText='--s:'+z.toFixed(0)+'px;left:'+(4+R()*92).toFixed(1)+'%;top:'+(14+R()*82).toFixed(1)+'%;animation-duration:'+du2.toFixed(1)+'s;animation-delay:-'+(R()*du2).toFixed(1)+'s';
        st.innerHTML='<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9.5V-2.8M0 2.8V9.5M-9.5 0H-2.8M2.8 0H9.5" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/></svg>';
        foam.appendChild(st);
      }
      bg.appendChild(foam);
    }
    build();
    addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(Math.abs(innerWidth-lw)>=40||Math.abs(innerHeight-lh)>=200)build()},300)});

    var q=location.search;
    if(q.indexOf('motion=off')>-1){root.classList.add('calm');return}
    if(q.indexOf('motion=on')>-1||!window.requestAnimationFrame)return;
    setTimeout(function(){
      var n=0,t0=0;
      function f(t){
        if(!t0)t0=t;n++;
        if(t-t0>=2500){var fps=n/((t-t0)/1000);if(fps<30)root.classList.add('calm');else if(fps<48)root.classList.add('lite');return}
        requestAnimationFrame(f);
      }
      requestAnimationFrame(f);
    },1200);
  })();

  (function(){
    var b=document.getElementById('folderBtn'),p=document.getElementById('subfolders'),info=document.querySelector('.info'),lock=false;
    var ease='cubic-bezier(.22,.61,.36,1)';
    function slide(y0){
      var d=y0-info.getBoundingClientRect().top;
      if(d&&info.animate)info.animate([{transform:'translateY('+d+'px)'},{transform:'none'}],{duration:480,easing:ease});
    }
    b.addEventListener('click',function(){
      if(lock)return;lock=true;
      var open=!p.classList.contains('open');
      b.setAttribute('aria-expanded',open);
      var y0=info.getBoundingClientRect().top;
      if(open){p.classList.add('open');slide(y0);setTimeout(function(){lock=false},560)}
      else{
        p.classList.add('closing');
        setTimeout(function(){
          var y1=info.getBoundingClientRect().top;
          p.classList.remove('open','closing');slide(y1);
          setTimeout(function(){lock=false},500);
        },200);
      }
    });
  })();
</script>
</body>
</html>
